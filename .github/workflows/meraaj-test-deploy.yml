name: Deploy Meraaj Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: meraaj-test-deploy
  cancel-in-progress: true

env:
  BACKEND_CONTAINER: ${{ vars.TEST_MERAAJ_BACKEND_CONTAINER || 'meraaj_fresh_test_backend' }}
  FRONTEND_CONTAINER: ${{ vars.TEST_MERAAJ_FRONTEND_CONTAINER || 'meraaj_fresh_test_frontend' }}
  BACKEND_PORT: ${{ vars.TEST_MERAAJ_BACKEND_PORT || '8010' }}
  FRONTEND_PORT: ${{ vars.TEST_MERAAJ_FRONTEND_PORT || '8014' }}
  BACKEND_ENV_FILE: ${{ vars.TEST_MERAAJ_BACKEND_ENV_FILE || '/root/meraaj_backend_env_test' }}
  NETWORK: ${{ vars.TEST_MERAAJ_NETWORK || 'meraaj_fresh_test_net' }}

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    # Job-level guard: main only, and only push-to-main or manual dispatch on main
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Guard - refuse any ref other than main
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "BLOCKED: Test deploy may only run on refs/heads/main. Current: ${{ github.ref }}"
            exit 1
          fi
          case "${{ github.event_name }}" in
            push|workflow_dispatch) : ;;
            *) echo "BLOCKED: event ${{ github.event_name }} may not deploy Test."; exit 1 ;;
          esac
          echo "Guard OK - deploying Test from main."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend & frontend images
        run: |
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          docker build -f Dockerfile.backend  -t "meraaj_backend:test-${SHORT_SHA}"  .
          docker build -f Dockerfile.frontend -t "meraaj_frontend:test-${SHORT_SHA}" .

      - name: Export images as gzip tarballs
        run: |
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          docker save "meraaj_backend:test-${SHORT_SHA}"  | gzip > meraaj_backend_test.tar.gz
          docker save "meraaj_frontend:test-${SHORT_SHA}" | gzip > meraaj_frontend_test.tar.gz

      - name: Setup SSH key (native, no third-party actions)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/meraaj_test_key
          chmod 600 ~/.ssh/meraaj_test_key
          ssh-keyscan -H "${{ vars.TEST_SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy images to test server (SCP)
        run: |
          scp -i ~/.ssh/meraaj_test_key -o StrictHostKeyChecking=no \
            meraaj_backend_test.tar.gz meraaj_frontend_test.tar.gz \
            "${{ vars.TEST_SERVER_USER }}@${{ vars.TEST_SERVER_HOST }}:/tmp/"

      - name: Deploy on test server (SSH)
        run: |
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          ssh -i ~/.ssh/meraaj_test_key -o StrictHostKeyChecking=no \
            "${{ vars.TEST_SERVER_USER }}@${{ vars.TEST_SERVER_HOST }}" \
            "BACKEND_CONTAINER='${{ env.BACKEND_CONTAINER }}' \
             FRONTEND_CONTAINER='${{ env.FRONTEND_CONTAINER }}' \
             BACKEND_PORT='${{ env.BACKEND_PORT }}' \
             FRONTEND_PORT='${{ env.FRONTEND_PORT }}' \
             BACKEND_ENV_FILE='${{ env.BACKEND_ENV_FILE }}' \
             NETWORK='${{ env.NETWORK }}' \
             SHORT_SHA='${SHORT_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          # --- Load the freshly built images ---
          gunzip -f /tmp/meraaj_backend_test.tar.gz
          gunzip -f /tmp/meraaj_frontend_test.tar.gz
          docker load -i /tmp/meraaj_backend_test.tar
          docker load -i /tmp/meraaj_frontend_test.tar

          # --- Ensure ONLY the test network exists (never touch live networks) ---
          docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK"

          # --- Remove ONLY the old test containers (by fixed name) ---
          docker rm -f "$BACKEND_CONTAINER"  >/dev/null 2>&1 || true
          docker rm -f "$FRONTEND_CONTAINER" >/dev/null 2>&1 || true

          # --- Backend: same env file, 8010:8000, test network, alias backend ---
          docker run -d --name "$BACKEND_CONTAINER" \
            --restart unless-stopped \
            --env-file "$BACKEND_ENV_FILE" \
            --network "$NETWORK" \
            --network-alias backend \
            -p "${BACKEND_PORT}:8000" \
            "meraaj_backend:test-${SHORT_SHA}"

          # --- Frontend: 8014:80, test network ---
          docker run -d --name "$FRONTEND_CONTAINER" \
            --restart unless-stopped \
            --network "$NETWORK" \
            -p "${FRONTEND_PORT}:80" \
            "meraaj_frontend:test-${SHORT_SHA}"

          # --- Health checks ---
          sleep 8

          # Backend: service is considered UP on 200 OR 404 (real endpoint, not a hard 404 failure)
          BE_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${BACKEND_PORT}/docs" || echo 000)"
          if [ "$BE_CODE" = "000" ]; then
            BE_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${BACKEND_PORT}/openapi.json" || echo 000)"
          fi
          echo "backend health code: $BE_CODE"
          case "$BE_CODE" in
            200|404) echo "backend OK ($BE_CODE)";;
            *) echo "backend FAILED ($BE_CODE)"; docker logs --tail 80 "$BACKEND_CONTAINER" || true; exit 1;;
          esac

          # Frontend: must be HTTP 200 on 127.0.0.1:8014
          FE_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${FRONTEND_PORT}/" || echo 000)"
          echo "frontend health code: $FE_CODE"
          if [ "$FE_CODE" != "200" ]; then
            echo "frontend FAILED ($FE_CODE)"; docker logs --tail 80 "$FRONTEND_CONTAINER" || true; exit 1
          fi

          # Public: must be HTTP 200 on the Test domain (end-to-end DNS/nginx/SSL), with retry
          echo "--- public health check: https://meraaj-test.targetmediagrp.com/ ---"
          PUB_CODE=000
          for i in $(seq 1 20); do
            PUB_CODE="$(curl -s -o /dev/null -w '%{http_code}' https://meraaj-test.targetmediagrp.com/ || echo 000)"
            if [ "$PUB_CODE" = "200" ]; then echo "public OK (200, attempt $i)"; break; fi
            echo "... public -> $PUB_CODE (attempt $i/20)"; sleep 2
          done
          if [ "$PUB_CODE" != "200" ]; then
            echo "public FAILED ($PUB_CODE)"; exit 1
          fi

          # --- Cleanup transferred tarballs ---
          rm -f /tmp/meraaj_backend_test.tar /tmp/meraaj_frontend_test.tar

          # --- Prune old test images, keep ONLY the current SHORT_SHA ---
          for img in meraaj_backend meraaj_frontend; do
            docker images "$img" --format '{{.Repository}}:{{.Tag}}' \
              | grep -E "^${img}:test-" \
              | grep -v "^${img}:test-${SHORT_SHA}$" \
              | xargs -r docker rmi -f || true
          done

          echo "Meraaj test deploy finished: test-${SHORT_SHA}"
          REMOTE
