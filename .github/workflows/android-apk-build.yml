name: Meraaj Android APK (Test)

on:
  workflow_dispatch:
  push:
    branches:
      - meraaj-updates
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk-build.yml'

env:
  REACT_APP_BACKEND_URL: https://meraaj-test.targetmediagrp.com

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout meraaj-updates
        uses: actions/checkout@v4
        with:
          ref: meraaj-updates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Yarn 1.22.22
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: meraaj-yarn-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            meraaj-yarn-${{ runner.os }}-

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      - name: Build web app for TEST
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Restore Android launcher background resource
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/res/mipmap
          cat > android/app/src/main/res/mipmap/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
          </shape>
          EOF

      - name: Verify TEST backend configuration
        working-directory: frontend
        run: |
          echo "REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL"
          test "$REACT_APP_BACKEND_URL" = "https://meraaj-test.targetmediagrp.com"

      - name: Build debug APK
        working-directory: frontend/android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        working-directory: frontend/android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Meraaj-Network-Test.apk

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: meraaj-network-test-apk
          path: frontend/android/app/build/outputs/apk/debug/Meraaj-Network-Test.apk
          if-no-files-found: error
          retention-days: 14
